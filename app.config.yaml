application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      vc-app-builder-runtime-api:
        license: Apache-2.0
        actions:
          VC-D365-API:
            function: actions/VC-D365-API/index.js
            web: secure
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              D365_APP_ID: $D365_APP_ID
              D365_API_URL: $D365_API_URL
              D365_CLIENT_ID: $D365_CLIENT_ID
              D365_GRANT_TYPE: $D365_GRANT_TYPE
              D365_CLIENT_SECRET: $D365_CLIENT_SECRET
              BOOMI_API_URL: $BOOMI_API_URL
              BOOMI_API_KEY: $BOOMI_API_KEY
            annotations:
              web-export: true
              raw-http: true
              require-adobe-auth: false
              final: true
          VC-Boomi-API:
            function: actions/VC-Boomi-API/index.js
            web: secure
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              BOOMI_API_URL: $BOOMI_API_URL
              BOOMI_API_KEY: $BOOMI_API_KEY
            annotations:
              web-export: true
              require-adobe-auth: true
              final: true    
